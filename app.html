<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Hotel Pet - Dashboard</title>
  </head>
  <body>
    <div class="main">
      <div class="tela logado">
        <!-- BARRA LATERAL FIXA -->
        <section class="navbar">
          <h1 class="logo">Hotel Pet</h1>
          <nav class="nav-menu">
            <!-- Usamos data-target para indicar qual template/tela carregar -->
            <a href="#" class="opcao ativo" data-target="pets">
              <img src="img/pet.svg" alt="Icone Pet" />
              <span>Pets</span>
            </a>
            <a href="#" class="opcao" data-target="usuarios">
              <img src="img/user.svg" alt="Icone Usuario" />
              <span>Usuários</span>
            </a>
            <a href="#" class="opcao" data-target="configuracoes">
              <img src="img/settings.svg" alt="Icone Configurações" />
              <span>Configurações</span>
            </a>
            <a href="#" class="opcao" data-target="reservas">
              <img src="img/book-open.svg" alt="Icone Reservas" />
              <span>Reservas</span>
            </a>
          </nav>
        </section>

        <!-- ÁREA PRINCIPAL ONDE AS TELAS SERÃO INJETADAS -->
        <section class="principal">
          <div class="user-header">
            <div class="user-info">
              <img src="img/user-circle.svg" alt="Foto do Perfil" />
              <span>João da Silva</span>
            </div>
          </div>

          <!-- É aqui que o conteúdo de cada tela vai aparecer dinamicamente -->
          <div id="app-container" class="conteudo-pagina">
            <!-- O conteúdo da tela atual entra aqui via JavaScript -->
          </div>
        </section>
      </div>
    </div>

    <!-- Script de roteamento genérico -->
    <script src="router.js"></script>
  </body>
</html>
